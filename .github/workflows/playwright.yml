name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  BASE_URL: https://automationexercise.com/
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests (fixed test data)
        run: npm run test:smoke
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-smoke

      - name: Run e2e tests (Faker-generated test data)
        run: npm run test:e2e
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-e2e

      - name: Run accessibility tests (axe-core, report-only)
        run: npm run test:a11y
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-a11y

      # No-op until the ANTHROPIC_API_KEY repo secret is configured - the AI-
      # assisted alt-text check is opt-in and isn't required for the rest of
      # the suite to run (see README > Accessibility testing).
      - name: Run AI-assisted accessibility check
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: npm run test:a11y:ai
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-a11y-ai

      - name: Upload smoke HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: playwright-report-smoke/
          retention-days: 14

      - name: Upload e2e HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: playwright-report-e2e/
          retention-days: 14

      - name: Upload accessibility HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-a11y
          path: playwright-report-a11y/
          retention-days: 14
